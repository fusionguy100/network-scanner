{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Network Security Dashboard</h2>

    <button id="scan_btn" class="btn btn-primary btn-lg">
        🔍 Run Scan
    </button>
</div>

<!-- Loading Screen -->
<div id="loading_screen">
    <div class="spinner"></div>
    <p class="mt-3">Scanning network... please wait</p>
</div>

<!-- Summary Cards -->
<div class="row mb-4">

    <div class="col-md-3">
        <div class="card shadow-sm text-center p-3">
            <h5>Total Devices</h5>
            <h2 id="total_devices" class="text-primary">0</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm text-center border-danger p-3">
            <h5>High Severity</h5>
            <h2 id="high_count" class="text-danger">0</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm text-center border-warning p-3">
            <h5>Medium Severity</h5>
            <h2 id="medium_count" class="text-warning">0</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm text-center border-success p-3">
            <h5>Low Severity</h5>
            <h2 id="low_count" class="text-success">0</h2>
        </div>
    </div>

</div>

<!-- Charts -->
<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Severity Breakdown</h5>
                <canvas id="severityChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Open Ports Distribution</h5>
                <canvas id="portsChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Device Table -->
<div class="card shadow-sm mt-4">
    <div class="card-body">
        <h5 class="card-title mb-3">Devices</h5>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>IP</th>
                    <th>Vendor</th>
                    <th>OS</th>
                    <th>Ports</th>
                    <th>Issues</th>
                </tr>
            </thead>
            <tbody id="device_rows"></tbody>
        </table>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/dashboard.js"></script>

{% endblock %}
