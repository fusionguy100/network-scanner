{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Scan History</h2>

<table class="table table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Timestamp</th>
            <th>Details</th>
        </tr>
    </thead>
    <tbody>
    {% for scan in scans %}
        <tr>
            <td>{{ scan.id }}</td>
            <td>{{ scan.timestamp }}</td>
            <td>
                <a href="/history/{{ scan.id }}" class="btn btn-primary btn-sm">View</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% if scans|length == 0 %}
<p>No scans saved yet.</p>
{% endif %}

{% endblock %}
